[package]
name = "critiq"
version = "1.0.0"
description = "CritIQ - Screenshot capture and annotation tool with AI-ready metadata export"
authors = ["MythologIQ"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
image = "0.25"
base64 = "0.22"
dirs = "5"
zip = { version = "8.6.0", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
