<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CritIQ</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/overlays.css">
  <link rel="stylesheet" href="styles/buttons.css">
  <link rel="stylesheet" href="styles/forms.css">
  <link rel="stylesheet" href="styles/modals.css">
  <link rel="stylesheet" href="styles/filmstrip.css">
</head>
<body>
  <div id="app">
    <header id="toolbar" class="topbar">
      <div class="toolbar-group">
        <button data-tool="capture" id="capture-btn" class="btn btn-primary">Capture</button>
        <button data-tool="quick-region" id="quick-region-btn" class="btn btn-secondary">Quick Region</button>
        <button data-tool="capture-all" id="capture-all-btn" class="btn btn-secondary">All Screens</button>
        <button data-tool="region" id="region-btn" class="btn btn-secondary">Select Region</button>
        <select id="screen-select" class="select">
          <option value="0">Primary Screen</option>
        </select>
        <select id="delay-select" class="select">
          <option value="0">No delay</option>
          <option value="2">2s delay</option>
          <option value="5">5s delay</option>
        </select>
      </div>
      <div class="toolbar-group markup-tools" id="markup-tools" style="display: none;">
        <button data-markup="pen" class="markup-btn active">Pen</button>
        <button data-markup="arrow" class="markup-btn">Arrow</button>
        <button data-markup="rect" class="markup-btn">Rectangle</button>
        <button data-markup="text" class="markup-btn">Text</button>
        <input type="color" id="markup-color" value="#6366f1" title="Color">
        <input type="range" id="markup-size" min="2" max="20" value="4" title="Size">
        <button data-markup="undo" class="markup-btn">Undo</button>
        <button data-markup="clear" class="markup-btn">Clear</button>
      </div>
      <div class="toolbar-group">
        <button data-tool="export" id="export-btn" class="btn btn-secondary" disabled>Export</button>
        <button data-tool="save" id="save-btn" class="btn btn-accent" disabled>Save</button>
        <button id="settings-btn" class="btn btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1-2.83 0l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="preview">
      <p class="placeholder">Click "Capture" to add the first storyboard frame</p>
    </main>

    <div id="filmstrip" class="filmstrip">
      <div class="filmstrip-inner" id="filmstrip-inner"></div>
    </div>

    <footer id="notes" class="panel">
      <form id="note-form">
        <div class="note-input-group">
          <textarea placeholder="Add notes about this frame..." rows="2"></textarea>
          <button type="button" id="mic-btn" class="btn-mic" title="Voice note (Speech-to-Text)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn btn-primary">Add Note</button>
      </form>
      <ul id="notes-list"></ul>
    </footer>
  </div>

  <div id="countdown-overlay" class="hidden">
    <span id="countdown-number">3</span>
  </div>

  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Settings</span>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-row">
          <label for="auto-save">Auto-save captures</label>
          <input type="checkbox" id="auto-save">
        </div>
        <div class="settings-row">
          <label for="capture-format">Capture format</label>
          <select id="capture-format" class="select">
            <option value="png">PNG (Lossless)</option>
            <option value="jpeg">JPEG (Smaller)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="export-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Export Storyboard</span>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <div class="export-option">
          <input type="radio" name="export-format" value="zip" id="export-zip" checked>
          <label for="export-zip">Storyboard ZIP (recommended)</label>
        </div>
        <div class="export-option">
          <input type="radio" name="export-format" value="individual" id="export-individual">
          <label for="export-individual">Storyboard folder</label>
        </div>
        <div class="export-option">
          <input type="radio" name="export-format" value="markdown" id="export-markdown">
          <label for="export-markdown">Storyboard Markdown</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" id="export-confirm">Export</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
