<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CritIQ</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/overlays.css">
  <link rel="stylesheet" href="styles/buttons.css">
  <link rel="stylesheet" href="styles/forms.css">
  <link rel="stylesheet" href="styles/modals.css">
  <link rel="stylesheet" href="styles/filmstrip.css">
  <link rel="stylesheet" href="styles/viewer.css">
</head>
<body>
  <div id="app">
    <header id="toolbar" class="topbar">
      <div class="toolbar-group">
        <button data-tool="new-session" class="btn btn-secondary" title="Start a new storyboard">New Session</button>
        <button data-tool="capture" id="capture-btn" class="btn btn-primary">Capture</button>
        <button data-tool="quick-region" id="quick-region-btn" class="btn btn-secondary">Quick Region</button>
        <button data-tool="capture-all" id="capture-all-btn" class="btn btn-secondary">All Screens</button>
        <button data-tool="region" id="region-btn" class="btn btn-secondary">Select Region</button>
        <select id="screen-select" class="select" aria-label="Screen">
          <option value="0">Primary Screen</option>
        </select>
        <select id="delay-select" class="select" aria-label="Capture delay">
          <option value="0">No delay</option>
          <option value="2">2s delay</option>
          <option value="5">5s delay</option>
        </select>
      </div>

      <div class="toolbar-group markup-tools" id="markup-tools" style="display: none;">
        <button data-markup="select" class="markup-btn" title="Select and move annotation (V)">Select</button>
        <button data-markup="pen" class="markup-btn active" title="Pen (P)">Pen</button>
        <button data-markup="arrow" class="markup-btn" title="Arrow (A)">Arrow</button>
        <button data-markup="line" class="markup-btn" title="Line (L)">Line</button>
        <button data-markup="rect" class="markup-btn" title="Rectangle (R)">Rectangle</button>
        <button data-markup="ellipse" class="markup-btn" title="Ellipse (E)">Ellipse</button>
        <button data-markup="text" class="markup-btn" title="Text (T)">Text</button>
        <input type="color" id="markup-color" value="#6366f1" title="Annotation color" aria-label="Annotation color">
        <input type="range" id="markup-size" min="2" max="20" value="4" title="Annotation size" aria-label="Annotation size">
        <button data-markup="undo" class="markup-btn" title="Undo (Ctrl+Z)">Undo</button>
        <button data-markup="delete" class="markup-btn" title="Delete selected annotation">Delete</button>
        <button data-markup="clear" class="markup-btn" title="Clear all annotations">Clear</button>
      </div>

      <div class="toolbar-group view-tools" id="view-tools" style="display: none;">
        <button data-view="pan" class="markup-btn" title="Toggle pan mode">Pan</button>
        <button data-view="zoom-out" class="markup-btn" title="Zoom out (Ctrl+-)">−</button>
        <span id="zoom-label" class="zoom-label">100%</span>
        <button data-view="zoom-in" class="markup-btn" title="Zoom in (Ctrl++)">+</button>
        <button data-view="reset" class="markup-btn" title="Reset view (Ctrl+0)">Reset View</button>
      </div>

      <div class="toolbar-group">
        <button data-tool="export" id="export-btn" class="btn btn-secondary" disabled>Export</button>
        <button data-tool="save" id="save-btn" class="btn btn-accent" disabled>Save Frame</button>
      </div>
    </header>

    <main id="preview">
      <p class="placeholder">Click "Capture" to add the first storyboard frame</p>
    </main>

    <div id="filmstrip" class="filmstrip" aria-label="Storyboard frames">
      <div class="filmstrip-inner" id="filmstrip-inner"></div>
    </div>

    <footer id="notes" class="panel">
      <div id="note-target" class="note-target">Notes attach to this frame</div>
      <form id="note-form">
        <div class="note-input-group">
          <textarea placeholder="Add notes about this frame..." rows="2"></textarea>
          <button type="button" id="mic-btn" class="btn-mic" title="Voice note using Web Speech">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn btn-primary">Add Note</button>
      </form>
      <ul id="notes-list"></ul>
    </footer>
  </div>

  <div id="countdown-overlay" class="hidden">
    <span id="countdown-number">3</span>
  </div>

  <div class="modal-overlay hidden" id="export-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Export Storyboard</span>
        <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="export-option">
          <input type="radio" name="export-format" value="zip" id="export-zip" checked>
          <label for="export-zip">Storyboard ZIP (recommended)</label>
        </div>
        <div class="export-option">
          <input type="radio" name="export-format" value="individual" id="export-individual">
          <label for="export-individual">Storyboard folder</label>
        </div>
        <div class="export-option">
          <input type="radio" name="export-format" value="markdown" id="export-markdown">
          <label for="export-markdown">Storyboard Markdown</label>
        </div>

        <div class="export-settings">
          <label for="image-format">Frame image format</label>
          <select id="image-format" class="select">
            <option value="png">PNG (lossless)</option>
            <option value="jpeg">JPEG (smaller)</option>
          </select>

          <label for="image-scale">Frame size</label>
          <select id="image-scale" class="select">
            <option value="100">100% (original)</option>
            <option value="75">75%</option>
            <option value="50">50%</option>
          </select>

          <div id="jpeg-quality-row" class="quality-row" hidden>
            <label for="jpeg-quality">JPEG quality <span id="jpeg-quality-value">90%</span></label>
            <input type="range" id="jpeg-quality" min="60" max="100" value="90">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" id="export-confirm">Export</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
