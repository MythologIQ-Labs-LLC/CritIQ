name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: critiq-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: npm run build

      - name: Commit resolved Cargo lockfile
        shell: bash
        run: |
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Cargo lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Preserve resolved Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Preserve Windows application bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: critiq-windows-bundle
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
