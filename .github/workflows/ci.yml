name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: critiq-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check locked Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: npm run build

      - name: Verify build did not mutate Cargo lockfile
        shell: bash
        run: git diff --exit-code -- src-tauri/Cargo.lock

      - name: Preserve Windows application bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: critiq-windows-bundle
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
